# HTTP bootstrap virtual host for Attention staging.
#
# Install this file under the Nginx `http` context (the default
# /etc/nginx/conf.d/*.conf include is suitable), validate it, and let Certbot's
# Nginx installer add TLS plus the HTTP-to-HTTPS redirect. Do not add a public
# listener for any Compose-internal service.

limit_req_zone $binary_remote_addr zone=attention_staging_auth:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=attention_staging_oauth_register:10m rate=1r/m;

# Deliberately omit every URL, query, Referer, and request-line variable. Invite,
# join, and channel-binding credentials can be carried in paths or queries and
# must never be persisted by the reverse proxy.
log_format attention_staging_safe escape=json
    '$remote_addr $time_iso8601 $request_method $server_protocol '
    '$status $body_bytes_sent $request_time';

server {
    listen 80;
    server_name attention-staging.noveltystudio.cn;

    access_log /var/log/nginx/attention-staging.access.log attention_staging_safe;
    error_log /var/log/nginx/attention-staging.error.log crit;

    client_max_body_size 2m;
    client_body_timeout 15s;
    client_header_timeout 15s;
    send_timeout 60s;

    proxy_http_version 1.1;
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    proxy_set_header Connection "";

    # Overwrite, rather than append to, all client identity/scheme headers.
    # Attention trusts X-Attention-Client-Source only because this edge derives
    # it from the peer connection instead of accepting a caller-supplied value.
    proxy_set_header X-Attention-Client-Source $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;

    limit_req_status 429;

    location = /oauth/register {
        limit_req zone=attention_staging_oauth_register burst=3 nodelay;
        proxy_pass http://127.0.0.1:9199;
    }

    location ^~ /api/auth/ {
        limit_req zone=attention_staging_auth burst=5 nodelay;
        proxy_pass http://127.0.0.1:9199;
    }

    location / {
        proxy_pass http://127.0.0.1:9199;
    }
}
