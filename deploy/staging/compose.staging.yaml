x-staging-logging: &staging-logging
  driver: json-file
  options:
    max-file: "5"
    max-size: 10m

services:
  postgres:
    cpus: 1.0
    logging: *staging-logging
    mem_limit: 1536m

  migrate:
    cpus: 1.0
    image: attention-staging-migrate:${ATTENTION_RELEASE_ID:?set ATTENTION_RELEASE_ID}
    logging: *staging-logging
    mem_limit: 1536m

  runtime-role-passwords:
    cpus: 0.25
    logging: *staging-logging
    mem_limit: 256m

  fetcher:
    cpus: 0.5
    image: attention-staging-fetcher:${ATTENTION_RELEASE_ID:?set ATTENTION_RELEASE_ID}
    labels:
      com.attention.environment: staging
      com.attention.release: ${ATTENTION_RELEASE_ID:?set ATTENTION_RELEASE_ID}
    logging: *staging-logging
    mem_limit: 512m

  web:
    cpus: 1.25
    image: attention-staging-web:${ATTENTION_RELEASE_ID:?set ATTENTION_RELEASE_ID}
    labels:
      com.attention.environment: staging
      com.attention.release: ${ATTENTION_RELEASE_ID:?set ATTENTION_RELEASE_ID}
    logging: *staging-logging
    mem_limit: 1536m
    ports:
      - "127.0.0.1:${WEB_PUBLISH_PORT:-9199}:3000"

  worker:
    cpus: 0.75
    image: attention-staging-worker:${ATTENTION_RELEASE_ID:?set ATTENTION_RELEASE_ID}
    labels:
      com.attention.environment: staging
      com.attention.release: ${ATTENTION_RELEASE_ID:?set ATTENTION_RELEASE_ID}
    logging: *staging-logging
    mem_limit: 1024m

  wechat-adapter:
    cpus: 0.5
    image: attention-staging-wechat-adapter:${ATTENTION_RELEASE_ID:?set ATTENTION_RELEASE_ID}
    labels:
      com.attention.environment: staging
      com.attention.release: ${ATTENTION_RELEASE_ID:?set ATTENTION_RELEASE_ID}
    logging: *staging-logging
    mem_limit: 512m

volumes:
  postgres_data:
    name: attention-staging-postgres-data
    driver: local
    driver_opts:
      device: ${ATTENTION_POSTGRES_DATA_PATH:?set ATTENTION_POSTGRES_DATA_PATH}
      o: bind
      type: none
