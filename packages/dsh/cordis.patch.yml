- insert:
    - id: attention-mcp
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: attention
        transport: streamable-http
        url: !!js 'process.env.ATTENTION_MCP_URL || "http://127.0.0.1:3000/mcp"'
        headers:
          Authorization: !!js '"Bearer " + (process.env.ATTENTION_API_KEY || "")'
        toolCallTimeoutMs: 30000
        failOnStartupError: true
