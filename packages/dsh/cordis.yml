# Attention DSH plugin — Cordis service registration
#
# This plugin registers:
# 1. Attention MCP tools (15 tools) — interactive collection management
# 2. iLink WeChat channel — receive and reply to WeChat messages
# 3. Runtime reporter — optional health checkpoints
#
# Config keys (set in DSH profile or environment):
#   ATTENTION_API_KEY  — Bearer token for Attention API
#   ATTENTION_BASE_URL — Attention server origin (default: http://127.0.0.1:3000)

# ── MCP tools ──────────────────────────────────────────────

- id: tool-attention-account
  name: "@attention/dsh"
  group: attention-tools
  config:
    toolName: attention_get_my_account

- id: tool-attention-membership
  name: "@attention/dsh"
  group: attention-tools
  config:
    toolName: attention_get_membership_status

- id: tool-attention-list-collections
  name: "@attention/dsh"
  group: attention-tools
  config:
    toolName: attention_list_collections

- id: tool-attention-collect
  name: "@attention/dsh"
  group: attention-tools
  config:
    toolName: attention_collect_content

- id: tool-attention-enrich
  name: "@attention/dsh"
  group: attention-tools
  config:
    toolName: attention_submit_content_enrichment

- id: tool-attention-select-candidate
  name: "@attention/dsh"
  group: attention-tools
  config:
    toolName: attention_select_collection_candidate

- id: tool-attention-collection-status
  name: "@attention/dsh"
  group: attention-tools
  config:
    toolName: attention_get_collection_status

- id: tool-attention-update-collection
  name: "@attention/dsh"
  group: attention-tools
  config:
    toolName: attention_update_collection

- id: tool-attention-public-feed
  name: "@attention/dsh"
  group: attention-tools
  config:
    toolName: attention_list_public_content

- id: tool-attention-search
  name: "@attention/dsh"
  group: attention-tools
  config:
    toolName: attention_search_content

- id: tool-attention-report
  name: "@attention/dsh"
  group: attention-tools
  config:
    toolName: attention_report_content

- id: tool-attention-court-cases
  name: "@attention/dsh"
  group: attention-tools
  config:
    toolName: attention_list_moderation_cases

- id: tool-attention-court-vote
  name: "@attention/dsh"
  group: attention-tools
  config:
    toolName: attention_cast_moderation_vote

- id: tool-attention-digest-get
  name: "@attention/dsh"
  group: attention-tools
  config:
    toolName: attention_get_digest_settings

- id: tool-attention-digest-update
  name: "@attention/dsh"
  group: attention-tools
  config:
    toolName: attention_update_digest_settings

# ── iLink WeChat channel ───────────────────────────────────

- id: attention-channel
  name: "@attention/dsh"
  group: attention-channel
  config:
    service: channel
    mode: native

# ── Runtime reporter (optional) ────────────────────────────

- id: attention-runtime-reporter
  name: "@attention/dsh"
  group: attention-runtime
  config:
    service: runtime-reporter
    required: false
